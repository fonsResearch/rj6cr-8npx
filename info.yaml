# Tiny Tapeout project information
project:
  title:        "Protocol emulator (working title)"      # Project title
  author:       "dean"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reprogrammable protocol emulator"      # One line description of what your project does
  language:     "Hardcaml (OCaml) emitted to Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     48000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rj6cr_8npx"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "probe_macros.v"
    - "sram_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HSCK: host SPI clock"
  ui[1]: "HMOSI: host SPI data in"
  ui[2]: "HCS_N: host SPI select"
  ui[3]: "P19: input"
  ui[4]: "P20: input"
  ui[5]: "P21: input"
  ui[6]: "P22: input"
  ui[7]: "P23: input"

  # Outputs
  uo[0]: "HMISO: host SPI data out"
  uo[1]: "P9: output"
  uo[2]: "P10: output"
  uo[3]: "P11: output"
  uo[4]: "P12: output"
  uo[5]: "P13: output"
  uo[6]: "P14: output"
  uo[7]: "P15: output"

  # Bidirectional pins
  uio[0]: "P0: bidirectional"
  uio[1]: "P1: bidirectional"
  uio[2]: "P2: bidirectional"
  uio[3]: "P3: bidirectional"
  uio[4]: "P4: bidirectional"
  uio[5]: "P5: bidirectional"
  uio[6]: "P6: bidirectional"
  uio[7]: "P7: bidirectional"

# Do not change!
yaml_version: 6
